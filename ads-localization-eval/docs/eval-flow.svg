<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="900" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrowDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9b2c2c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="900" fill="#ffffff"/>
  <text x="40" y="40" font-size="22" font-weight="700" fill="#1a202c">Ads Localization Eval — English → Greek (el-GR)</text>
  <text x="40" y="62" font-size="13" fill="#718096">Eval-driven loop: a frozen grader harness scores your translation agent's output every time you change the agent.</text>

  <!-- ===================== 1. INPUTS ===================== -->
  <text x="40" y="92" font-size="14" font-weight="700" fill="#2b6cb0">1 · INPUTS</text>

  <!-- tasks.json -->
  <rect x="40" y="102" width="260" height="78" rx="7" fill="#e3f0fb" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="56" y="126" font-size="14" font-weight="700" fill="#1a365d">tasks.json</text>
  <text x="56" y="146" font-size="12" fill="#2c5282">English ad copy +</text>
  <text x="56" y="163" font-size="12" fill="#2c5282">channel + brand brief</text>

  <!-- rules.config -->
  <rect x="330" y="102" width="270" height="78" rx="7" fill="#e3f0fb" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="346" y="126" font-size="14" font-weight="700" fill="#1a365d">config/rules.config.yaml</text>
  <text x="346" y="146" font-size="12" fill="#2c5282">deterministic rule inputs</text>
  <text x="346" y="163" font-size="12" fill="#2c5282">glossary · limits · DNT · format</text>

  <!-- taste.config -->
  <rect x="630" y="102" width="270" height="78" rx="7" fill="#e3f0fb" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="646" y="126" font-size="14" font-weight="700" fill="#1a365d">config/taste.config.yaml</text>
  <text x="646" y="146" font-size="12" fill="#2c5282">judge criteria + weights</text>
  <text x="646" y="163" font-size="12" fill="#2c5282">+ rubrics (no code change)</text>

  <!-- ===================== 2. GENERATE ===================== -->
  <text x="40" y="230" font-size="14" font-weight="700" fill="#b7791f">2 · GENERATE  (the agent you iterate — lives outside the harness)</text>

  <rect x="40" y="244" width="240" height="78" rx="7" fill="#fdf0d5" stroke="#b7791f" stroke-width="1.5"/>
  <text x="56" y="268" font-size="14" font-weight="700" fill="#744210">translate-ads.ts</text>
  <text x="56" y="288" font-size="12" fill="#975a16">build prompt,</text>
  <text x="56" y="305" font-size="12" fill="#975a16">open agent session</text>

  <rect x="335" y="244" width="265" height="78" rx="7" fill="#fdf0d5" stroke="#b7791f" stroke-width="1.5"/>
  <text x="351" y="268" font-size="14" font-weight="700" fill="#744210">Your copy translation agent</text>
  <text x="351" y="288" font-size="12" fill="#975a16">Claude Managed Agents</text>
  <text x="351" y="305" font-size="12" fill="#975a16">(English → Greek)</text>

  <rect x="655" y="244" width="245" height="78" rx="7" fill="#fdf0d5" stroke="#b7791f" stroke-width="1.5"/>
  <text x="671" y="268" font-size="14" font-weight="700" fill="#744210">runs/&lt;task&gt;/output.txt</text>
  <text x="671" y="288" font-size="12" fill="#975a16">Greek copy</text>
  <text x="671" y="305" font-size="12" fill="#975a16">(the artifact to grade)</text>

  <!-- input->generate arrow -->
  <path d="M170,180 L170,244" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- generate chain -->
  <path d="M280,283 L335,283" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M600,283 L655,283" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ===================== 3. GRADE ===================== -->
  <rect x="40" y="350" width="1100" height="500" rx="10" fill="#f1f4f8" stroke="#4a5568" stroke-width="1.5"/>
  <text x="60" y="378" font-size="14" font-weight="700" fill="#2d3748">3 · GRADE — eval-runner.ts  (frozen harness: never changes while you tune the agent)</text>

  <!-- buildContext -->
  <rect x="70" y="398" width="270" height="72" rx="7" fill="#ffffff" stroke="#4a5568" stroke-width="1.3"/>
  <text x="86" y="422" font-size="14" font-weight="700" fill="#2d3748">buildContext(task)</text>
  <text x="86" y="442" font-size="12" fill="#4a5568">read output.txt →</text>
  <text x="86" y="459" font-size="12" fill="#4a5568">parseResponse() (pure facts)</text>

  <!-- GraderContext -->
  <rect x="70" y="500" width="270" height="92" rx="7" fill="#ffffff" stroke="#4a5568" stroke-width="1.3"/>
  <text x="86" y="524" font-size="14" font-weight="700" fill="#2d3748">GraderContext</text>
  <text x="86" y="544" font-size="12" fill="#4a5568">{ task, output, parsed,</text>
  <text x="86" y="561" font-size="12" fill="#4a5568">&#160; rules, taste, client }</text>
  <text x="86" y="582" font-size="11" fill="#718096" font-style="italic">one per task</text>

  <!-- output.txt -> buildContext -->
  <path d="M740,322 C740,360 205,360 205,398" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- buildContext -> GraderContext -->
  <path d="M205,470 L205,500" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- fan-out label -->
  <text x="360" y="512" font-size="12" font-weight="700" fill="#2d3748">Promise.all(</text>
  <text x="360" y="528" font-size="12" font-weight="700" fill="#2d3748">GRADERS.map(grade))</text>
  <text x="360" y="546" font-size="11" fill="#718096" font-style="italic">independent → fan out</text>

  <!-- Code graders -->
  <rect x="560" y="398" width="270" height="230" rx="8" fill="#e6f4ea" stroke="#2f855a" stroke-width="1.5"/>
  <text x="576" y="421" font-size="13" font-weight="700" fill="#22543d">Code graders — deterministic, free</text>
  <text x="576" y="447" font-size="12" fill="#276749">• Produced</text>
  <text x="576" y="467" font-size="12" fill="#276749">• Over limit (channel)</text>
  <text x="576" y="487" font-size="12" fill="#276749">• Placeholder integrity</text>
  <text x="576" y="507" font-size="12" fill="#276749">• Do-not-translate kept</text>
  <text x="576" y="527" font-size="12" fill="#276749">• Glossary adherence</text>
  <text x="576" y="547" font-size="12" fill="#276749">• Greek-script ratio</text>
  <text x="576" y="567" font-size="12" fill="#276749">• Locale formatting (el-GR)</text>
  <text x="576" y="587" font-size="12" fill="#276749">• Banned anglicisms</text>
  <text x="576" y="613" font-size="11" font-style="italic" fill="#38a169">each = one number/string column</text>

  <!-- Judge graders -->
  <rect x="850" y="398" width="270" height="230" rx="8" fill="#efe6f7" stroke="#6b46c1" stroke-width="1.5"/>
  <text x="866" y="421" font-size="13" font-weight="700" fill="#44337a">Taste judges — LLM-as-judge</text>
  <text x="866" y="447" font-size="12" fill="#553c9a">judgeTaste(ctx):</text>
  <text x="866" y="465" font-size="12" fill="#553c9a">ONE memoized model call / task</text>
  <text x="866" y="483" font-size="12" fill="#553c9a">→ scores ALL criteria at once</text>
  <text x="866" y="501" font-size="12" fill="#553c9a">(structured output, Zod schema</text>
  <text x="866" y="519" font-size="12" fill="#553c9a">&#160;built from taste.config)</text>
  <line x1="866" y1="532" x2="1104" y2="532" stroke="#b794f4" stroke-width="1"/>
  <text x="866" y="552" font-size="12" fill="#553c9a">Columns: Fluency · Tone ·</text>
  <text x="866" y="570" font-size="12" fill="#553c9a">Transcreation · Persuasiveness ·</text>
  <text x="866" y="588" font-size="12" fill="#553c9a">Brevity · Taste (weighted)</text>
  <text x="866" y="613" font-size="11" font-style="italic" fill="#805ad5">all share the single call</text>

  <!-- context -> graders -->
  <path d="M340,536 C460,536 470,500 560,500" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M340,548 C620,560 720,560 850,520" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- config feeds (dashed) -->
  <path d="M465,180 C520,300 600,300 640,398" fill="none" stroke="#2f855a" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="486" y="250" font-size="11" fill="#2f855a" font-style="italic">rules →</text>
  <path d="M820,180 C930,300 960,300 965,398" fill="none" stroke="#6b46c1" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="930" y="250" font-size="11" fill="#6b46c1" font-style="italic">taste →</text>

  <!-- ===================== outputs ===================== -->
  <!-- score.json -->
  <rect x="560" y="668" width="270" height="76" rx="7" fill="#fff5f5" stroke="#c53030" stroke-width="1.5"/>
  <text x="576" y="692" font-size="13" font-weight="700" fill="#742a2a">runs/&lt;task&gt;/score.json</text>
  <text x="576" y="712" font-size="12" fill="#9b2c2c">values + parsed facts</text>
  <text x="576" y="729" font-size="12" fill="#9b2c2c">+ judge comment</text>

  <!-- scorecard -->
  <rect x="850" y="668" width="270" height="76" rx="7" fill="#fff5f5" stroke="#c53030" stroke-width="1.5"/>
  <text x="866" y="692" font-size="13" font-weight="700" fill="#742a2a">scorecard (stdout)</text>
  <text x="866" y="712" font-size="12" fill="#9b2c2c">heat-map table</text>
  <text x="866" y="729" font-size="12" fill="#9b2c2c">+ Δ vs baseline</text>

  <!-- baseline -->
  <rect x="70" y="668" width="270" height="76" rx="7" fill="#fffaf0" stroke="#dd6b20" stroke-width="1.5"/>
  <text x="86" y="692" font-size="13" font-weight="700" fill="#7b341e">baseline.score.json</text>
  <text x="86" y="712" font-size="12" fill="#9c4221">pinned reference</text>
  <text x="86" y="729" font-size="12" fill="#9c4221">(written via --baseline)</text>

  <!-- graders -> score.json -->
  <path d="M695,628 L695,668" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M985,628 C985,648 720,648 730,668" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- score.json -> scorecard -->
  <path d="M830,706 L850,706" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- baseline -> scorecard (delta, dashed) -->
  <path d="M340,724 C600,790 700,790 866,740" fill="none" stroke="#9b2c2c" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrowDash)"/>
  <text x="560" y="785" font-size="11" fill="#9b2c2c" font-style="italic">deltas compare to pinned baseline</text>

  <!-- ===================== feedback loop ===================== -->
  <path d="M1120,706 C1160,706 1160,283 905,283" fill="none" stroke="#9b2c2c" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrowDash)"/>
  <text x="980" y="868" font-size="12" font-weight="700" fill="#9b2c2c">read scorecard → edit agent prompt / config → regenerate → re-grade  (the eval-driven loop)</text>
</svg>
